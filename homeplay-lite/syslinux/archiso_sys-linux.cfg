LABEL homeplay
TEXT HELP
Boot HomePlay Lite OS on BIOS.
ENDTEXT
MENU LABEL HomePlay Lite OS (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lts
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lts.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%

LABEL homeplay_safe
TEXT HELP
Boot HomePlay Lite OS with safe graphics for old laptops.
ENDTEXT
MENU LABEL HomePlay Lite OS safe graphics (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lts
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lts.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset
